<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polyglot Live — Speaker</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<style>
  :root{--bg:#080c14;--surface:#0d1220;--surface2:#131929;--border:rgba(255,255,255,0.07);--accent:#00d4ff;--accent2:#7b61ff;--text:#e8edf7;--muted:#5a6478;--live:#00ff88;--qa:#ff9f43;--warn:#ffcc00;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:500;}
  body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
  header{padding:16px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:relative;z-index:10;flex-shrink:0;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-icon{width:30px;height:30px;border:1.5px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--accent);}
  .logo h1{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;}
  .logo span{color:var(--muted);font-weight:300;}
  .role-badge{padding:4px 12px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;border:1px solid rgba(0,212,255,0.3);color:var(--accent);background:rgba(0,212,255,0.07);}
  .main{position:relative;z-index:10;padding:20px 28px;display:flex;flex-direction:column;gap:16px;flex:1;}
  .room-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .room-info{flex:1;}
  .room-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .room-code{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:500;letter-spacing:0.15em;color:var(--accent);text-shadow:0 0 20px rgba(0,212,255,0.3);}
  .room-hint{font-size:12px;color:var(--muted);margin-top:4px;}
  .relay-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;margin-top:6px;}
  .relay-badge.webrtc{background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.25);color:var(--live);}
  .relay-badge.ntfy{background:rgba(255,204,0,0.1);border:1px solid rgba(255,204,0,0.25);color:var(--warn);}
  .relay-badge.connecting{background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);color:var(--accent);}
  .room-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .copy-btn{padding:7px 16px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;transition:all 0.2s;}
  .copy-btn:hover{border-color:rgba(0,212,255,0.3);color:var(--accent);}
  .copy-btn.copied{border-color:rgba(0,255,136,0.3);color:var(--live);}
  #qrImg{width:80px;height:80px;border-radius:8px;}
  .controls{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;cursor:pointer;outline:none;}
  .mic-btn{display:flex;align-items:center;gap:8px;padding:9px 22px;border-radius:8px;border:1.5px solid var(--accent);background:rgba(0,212,255,0.05);color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;transition:all 0.2s;}
  .mic-btn.recording{background:rgba(0,255,136,0.08);border-color:var(--live);color:var(--live);box-shadow:0 0 16px rgba(0,255,136,0.15);}
  .status-row{display:flex;align-items:center;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);transition:all 0.3s;}
  .dot.live{background:var(--live);box-shadow:0 0 8px var(--live);animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .columns{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;}
  .panel-header{padding:12px 18px;border-bottom:1px solid var(--border);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .badge{padding:2px 8px;border-radius:3px;font-size:9px;}
  .badge-blue{background:rgba(0,212,255,0.12);color:var(--accent);border:1px solid rgba(0,212,255,0.2);}
  .badge-orange{background:rgba(255,159,67,0.12);color:var(--qa);border:1px solid rgba(255,159,67,0.25);}
  .panel-body{flex:1;padding:18px;overflow-y:auto;font-size:15px;line-height:1.7;}
  .interim{color:var(--muted);font-style:italic;}
  .placeholder{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}
  .qa-msg{background:var(--surface2);border:1px solid rgba(255,159,67,0.15);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .qa-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--qa);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;}
  .qa-text{font-size:14px;line-height:1.6;}
  .qa-original{font-size:11px;color:var(--muted);font-style:italic;margin-top:5px;}
  .qa-speak-btn{padding:3px 10px;border-radius:4px;border:1px solid rgba(255,159,67,0.3);background:transparent;color:var(--qa);font-family:'IBM Plex Mono',monospace;font-size:10px;cursor:pointer;}
  .waveform{display:flex;align-items:center;gap:2px;height:14px;}
  .wave-bar{width:2px;border-radius:2px;background:var(--live);animation:wave 0.8s ease-in-out infinite;transform-origin:bottom;}
  .wave-bar:nth-child(1){height:5px}.wave-bar:nth-child(2){height:10px;animation-delay:0.1s}.wave-bar:nth-child(3){height:14px;animation-delay:0.2s}.wave-bar:nth-child(4){height:8px;animation-delay:0.1s}.wave-bar:nth-child(5){height:4px}
  @keyframes wave{0%,100%{transform:scaleY(0.4);opacity:0.5}50%{transform:scaleY(1);opacity:1}}
  .new-badge{display:inline-block;background:var(--qa);color:#000;font-family:'IBM Plex Mono',monospace;font-size:9px;padding:1px 6px;border-radius:3px;}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-icon">⬡</div><h1>POLYGLOT <span>// LIVE</span></h1></div>
  <div class="role-badge">🎙 Speaker</div>
</header>
<div class="main">
  <div class="room-card">
    <div class="room-info">
      <div class="room-label">Room Code</div>
      <div class="room-code" id="roomCode">● ● ● ● ● ●</div>
      <div class="room-hint">Share this with your audience — they open audience.html and enter this code</div>
      <div class="relay-badge connecting" id="relayBadge">⟳ Setting up connection...</div>
    </div>
    <div class="room-actions">
      <button class="copy-btn" onclick="copyCode(this)">📋 Copy Code</button>
      <button class="copy-btn" onclick="copyLink(this)">🔗 Copy Audience Link</button>
      <img id="qrImg" src="" alt="QR" style="display:none">
    </div>
  </div>
  <div class="controls">
    <label>Speaking in</label>
    <select id="sourceLang">
      <option value="en">English</option><option value="es">Spanish</option><option value="fr">French</option>
      <option value="de">German</option><option value="zh-CN">Mandarin</option><option value="ja">Japanese</option>
      <option value="pt">Portuguese</option><option value="ru">Russian</option><option value="ar">Arabic</option>
      <option value="vi">Vietnamese</option><option value="ko">Korean</option><option value="hi">Hindi</option>
    </select>
    <div style="margin-left:auto;display:flex;align-items:center;gap:14px;">
      <div class="status-row">
        <div class="dot" id="liveDot"></div><span id="statusText">STANDBY</span>
        <span style="margin-left:8px;font-size:11px" id="peerCount"></span>
      </div>
      <button class="mic-btn" id="micBtn" onclick="toggleRecording()">⏺ START SPEAKING</button>
    </div>
  </div>
  <div class="columns">
    <div class="panel">
      <div class="panel-header">
        <span>My Live Transcript</span>
        <div id="waveformWrap" style="display:none"><div class="waveform"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div></div>
        <div class="badge badge-blue">SPEAKER</div>
      </div>
      <div class="panel-body" id="transcriptBody"><div class="placeholder">🎙 Press START SPEAKING then talk.</div></div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span>Audience Questions</span>
        <span id="qaNewBadge" style="display:none"><span class="new-badge">NEW</span></span>
        <div class="badge badge-orange">Q&amp;A</div>
      </div>
      <div class="panel-body" id="qaBody"><div class="placeholder" id="qaPlaceholder">Audience questions appear here, pre-translated.</div></div>
    </div>
  </div>
</div>
<script>
// ── Transport layer ───────────────────────────────────────────────────────────
// Tries WebRTC (PeerJS) first for low latency (~50ms).
// If PeerJS server is down or connection fails, automatically falls back
// to ntfy.sh (reliable, ~1–2s). Audience detects which mode is active.

let roomCode = '';
let useWebRTC = false;
let peer = null;
let connections = []; // WebRTC connections
const NTFY_BASE = 'https://ntfy.sh';

// Generate or restore room code
function getOrCreateCode() {
  const saved = localStorage.getItem('polyglot-room-v2');
  if (saved) return saved;
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
  localStorage.setItem('polyglot-room-v2', c);
  return c;
}

function setRoomCode(code) {
  roomCode = code;
  document.getElementById('roomCode').textContent = code;
  const audienceURL = window.location.href.replace('speaker.html', 'audience.html') + '?room=' + code;
  document.getElementById('qrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?data=' + encodeURIComponent(audienceURL) + '&size=80x80&bgcolor=0d1220&color=00d4ff&margin=6';
  document.getElementById('qrImg').style.display = 'block';
}

function setRelayMode(mode) {
  const badge = document.getElementById('relayBadge');
  if (mode === 'webrtc') {
    badge.className = 'relay-badge webrtc';
    badge.textContent = '⚡ WebRTC — ultra-low latency';
    useWebRTC = true;
  } else if (mode === 'ntfy') {
    badge.className = 'relay-badge ntfy';
    badge.textContent = '📡 Cloud relay — works everywhere';
    useWebRTC = false;
  } else {
    badge.className = 'relay-badge connecting';
    badge.textContent = '⟳ ' + mode;
  }
}

// ── Try PeerJS WebRTC ─────────────────────────────────────────────────────────
function initPeer(code) {
  setRelayMode('Trying direct connection...');
  const peerId = 'polyglot-' + code.toLowerCase();

  // Timeout: if peer doesn't open in 5s, fall back to ntfy
  const timeout = setTimeout(() => {
    if (!useWebRTC) {
      console.log('PeerJS timeout — using ntfy fallback');
      if (peer) { try { peer.destroy(); } catch(e) {} peer = null; }
      setRelayMode('ntfy');
    }
  }, 5000);

  try {
    peer = new Peer(peerId, { debug: 0 });

    peer.on('open', () => {
      clearTimeout(timeout);
      setRelayMode('webrtc');
      console.log('PeerJS ready:', peerId);
    });

    peer.on('connection', (conn) => {
      conn.on('open', () => {
        connections.push(conn);
        updatePeerCount();
        conn.send({ type: 'config', sourceLang: document.getElementById('sourceLang').value, mode: 'webrtc' });
      });
      conn.on('data', (data) => {
        if (data.type === 'qa') showQAMessage(data);
      });
      conn.on('close', () => { connections = connections.filter(c => c !== conn); updatePeerCount(); });
      conn.on('error', () => { connections = connections.filter(c => c !== conn); updatePeerCount(); });
    });

    peer.on('error', (err) => {
      clearTimeout(timeout);
      console.log('PeerJS error:', err.type);
      if (err.type === 'unavailable-id') {
        // ID taken — clear saved and regenerate
        localStorage.removeItem('polyglot-room-v2');
        const newCode = getOrCreateCode();
        setRoomCode(newCode);
        initPeer(newCode);
      } else {
        // Any other error — fall back to ntfy
        if (peer) { try { peer.destroy(); } catch(e) {} peer = null; }
        setRelayMode('ntfy');
      }
    });
  } catch(e) {
    clearTimeout(timeout);
    setRelayMode('ntfy');
  }
}

// ── Broadcast to all audience ─────────────────────────────────────────────────
function broadcast(data) {
  if (useWebRTC && connections.length > 0) {
    // WebRTC: send directly to each connected peer
    connections.forEach(conn => { try { conn.send(data); } catch(e) {} });
  } else {
    // ntfy fallback: post to topic
    const payload = JSON.stringify(data);
    fetch(NTFY_BASE + '/polyglot-' + roomCode.toLowerCase(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Title': 'msg' },
      body: payload
    }).catch(() => {});
  }
}

function updatePeerCount() {
  const n = connections.length;
  document.getElementById('peerCount').textContent = n > 0 ? n + ' audience' + (n !== 1 ? 's' : '') : '';
}

// ── Init ──────────────────────────────────────────────────────────────────────
const code = getOrCreateCode();
setRoomCode(code);
initPeer(code);

function copyCode(btn) { navigator.clipboard.writeText(roomCode); btn.textContent = '✓ Copied!'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = '📋 Copy Code'; btn.classList.remove('copied'); }, 2000); }
function copyLink(btn) {
  const url = window.location.href.replace('speaker.html', 'audience.html') + '?room=' + roomCode;
  navigator.clipboard.writeText(url); btn.textContent = '✓ Copied!'; btn.classList.add('copied');
  setTimeout(() => { btn.textContent = '🔗 Copy Audience Link'; btn.classList.remove('copied'); }, 2000);
}

// ── Speech recognition ────────────────────────────────────────────────────────
let recognition = null, isRecording = false, finalTranscript = '';
let broadcastDebounce = null, lastBroadcast = '';

function toggleRecording() { isRecording ? stopRecording() : startRecording(); }

function startRecording() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Speech recognition requires Chrome or Edge.'); return; }
  recognition = new SR();
  recognition.lang = document.getElementById('sourceLang').value;
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('micBtn').className = 'mic-btn recording';
    document.getElementById('micBtn').innerHTML = '⏹ STOP SPEAKING';
    document.getElementById('liveDot').classList.add('live');
    document.getElementById('statusText').textContent = 'LIVE';
    document.getElementById('waveformWrap').style.display = 'block';
    broadcast({ type: 'config', sourceLang: document.getElementById('sourceLang').value });
  };
  recognition.onresult = (e) => {
    let interim = ''; finalTranscript = '';
    for (let i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    updateTranscript(finalTranscript, interim);
    const payload = {
      type: 'transcript',
      final: finalTranscript.trim(),
      interim: interim.trim(),
      text: (finalTranscript + (interim ? ' ' + interim : '')).trim(),
      sourceLang: document.getElementById('sourceLang').value,
      ts: Date.now()
    };
    const key = payload.text;
    if (key === lastBroadcast) return;
    clearTimeout(broadcastDebounce);
    // WebRTC: 80ms debounce (fast). ntfy: 600ms (avoid rate limits)
    const delay = useWebRTC ? 80 : 600;
    broadcastDebounce = setTimeout(() => { lastBroadcast = key; broadcast(payload); }, delay);
  };
  recognition.onerror = (e) => { if (e.error !== 'no-speech') console.error(e.error); };
  recognition.onend = () => { if (isRecording) try { recognition.start(); } catch(e) {} };
  recognition.start();
}

function stopRecording() {
  isRecording = false;
  if (recognition) recognition.stop();
  document.getElementById('micBtn').className = 'mic-btn';
  document.getElementById('micBtn').innerHTML = '⏺ START SPEAKING';
  document.getElementById('liveDot').classList.remove('live');
  document.getElementById('statusText').textContent = 'STANDBY';
  document.getElementById('waveformWrap').style.display = 'none';
  if (finalTranscript.trim()) {
    broadcast({ type: 'transcript', final: finalTranscript.trim(), interim: '', text: finalTranscript.trim(), sourceLang: document.getElementById('sourceLang').value, ts: Date.now(), flush: true });
  }
}

function updateTranscript(final, interim) {
  const body = document.getElementById('transcriptBody');
  let html = final ? '<span>' + esc(final) + '</span>' : '';
  if (interim) html += '<span class="interim"> ' + esc(interim) + '</span>';
  body.innerHTML = html || '<div class="placeholder">🎙 Speak now...</div>';
  body.scrollTop = body.scrollHeight;
}

function esc(t) { return (t || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ── Q&A ───────────────────────────────────────────────────────────────────────
function showQAMessage(payload) {
  document.getElementById('qaPlaceholder')?.remove();
  const body = document.getElementById('qaBody');
  const div = document.createElement('div'); div.className = 'qa-msg';
  div.innerHTML =
    '<div class="qa-meta"><span>👤 ' + esc(payload.fromLang || 'Audience') + '</span>' +
    '<button class="qa-speak-btn" onclick="speakQA(this,\'' + esc(payload.translatedText) + '\',\'en\')">▶ SPEAK</button></div>' +
    '<div class="qa-text">' + esc(payload.translatedText) + '</div>' +
    (payload.originalText ? '<div class="qa-original">Original: "' + esc(payload.originalText) + '"</div>' : '');
  body.prepend(div);
  const badge = document.getElementById('qaNewBadge'); badge.style.display = 'inline';
  setTimeout(() => badge.style.display = 'none', 4000);
}

// ntfy Q&A listener (for when audience uses ntfy fallback)
function startNtfyQAListener() {
  const topic = 'polyglot-' + roomCode.toLowerCase() + '-qa';
  const es = new EventSource(NTFY_BASE + '/' + topic + '/sse');
  es.addEventListener('message', (e) => {
    try {
      const msg = JSON.parse(e.data);
      const p = msg.message ? JSON.parse(msg.message) : msg;
      if (p.type === 'qa' && p.translatedText) showQAMessage(p);
    } catch(err) {}
  });
}
startNtfyQAListener();

function speakQA(btn, text, lang) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = lang || 'en'; u.rate = 0.95;
  btn.textContent = '▶ PLAYING...'; u.onend = () => btn.textContent = '▶ SPEAK'; u.onerror = () => btn.textContent = '▶ SPEAK';
  window.speechSynthesis.speak(u);
}
window.speechSynthesis.getVoices();
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
</script>
</body>
</html>
